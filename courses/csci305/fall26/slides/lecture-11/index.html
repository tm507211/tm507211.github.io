<meta name="description" content="&quot;Lecture 11 (Expressions vs Statements). Opens Part IV (State &amp; Control Flow),\nCh. 15 / control-flow.md, on the road to M3. The design question of the day:\nwhat does a construct that DOES SOMETHING evaluate to? Two answers — a\nstatement (no value, own category) or an expression (a value like any other) —\nand where each language draws the line between them. Visual/example-led: the\nsame `if` used for its value; the historical line sliding from Fortran/Algol 60\n(firm boundary, two conditionals) through Algol 68 (units + void) and Lisp to\nML/Ruby/Rust (low); C&#039;s two footguns (a second conditional `?:`, and\n`if (x = 0)`); unit as the value that carries the effectful forms; Bridger&#039;s\nblock = items + trailing expr, the `;` as the discard, `let` NOT an expression;\none `eval_expr`, one typing judgment. Close on the design axes. Target 40–45 min.\n&quot;">
