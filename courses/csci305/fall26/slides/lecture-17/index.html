<meta name="description" content="&quot;Lecture 17 (Static vs. Dynamic Scope). Ch. 22 / functions/scope.md, on the road to M4.\nSHORT DECK (~20 min) — the schedule is behind; it follows the tail of L16 on the same day.\nWarm-up: Bash&#039;s dynamically scoped `local` (manual&#039;s own example). The problem: `scaled`\n(40 vs 8) and `twice(add_x, 10)` (12 vs 30; rename the parameter → 12). Theory: E-App vs\nE-App-Dyn differ in ONE premise; the chain of active calls. History: Slagle&#039;s bug,\nMcCarthy&#039;s &quot;lexical scoping was wanted, and dynamic scoping was obtained&quot;, Russell&#039;s\nFUNARG; the slow repair (LISP 1.5 opt-in, Moses 1970, Scheme 1975, Common Lisp, Emacs).\nWhat breaks: callers decide, renaming changes meaning, returned functions lose bindings.\nBridger: static, permanently — a free name has one type per call path under dynamic scope.\nOptional M4 experiment. Design space: dynamic binding kept on purpose (Emacs, Perl `local`,\nparameterize), exception handlers found the same way, GHC implicit parameters.\nNo new rule, no new arm. Every example checked on the reference interpreter and a scratch\ncopy whose Call arm extends the CALLER&#039;s env (see the chapter&#039;s authoring note).\n&quot;">
