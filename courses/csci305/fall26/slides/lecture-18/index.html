<meta name="description" content="&quot;Lecture 18 (Recursion &amp; Higher-Order Functions). Ch. 23 / functions/functional.md, on the\nroad to M4. SHORT DECK (~20–25 min) — the schedule is behind; it follows the tail of L17.\nProblem: top-level fact runs, the same lambda in main is UnboundVariable, sum_to(1000000) is\nStackOverflow. Why: env0 holds the closures that capture it; E-Let&#039;s closure can&#039;t see its\nown binding. History: FLPL had no recursion; McCarthy&#039;s &quot;λ-notation is inadequate&quot; and\nlabel; Rochester invented LABEL, Park said LAMBDA suffices (Y); Dijkstra&#039;s stack; FORTRAN 77\nstill forbids it. Theory: self-application f(f, 5); fact = F(fact), a fixed point; F^k(zero)\napproximations; Y loops under call by value, Z works. Bridger: top-level fn only; the\ninterpreter ties env0 by allocate-then-fill, a program can do the same with a ref cell;\nPart VI rejects self-application (infinite type). Cost: one frame per call, 100 000 max,\nnative fold opens none, tail calls get no special treatment. Design space: Scheme requires\nproper tail calls, ES2015 specified them, Python declined, Rust proposes `become`.\nNo new rule, no new arm. Every Bridger example checked on the reference interpreter\n(--features m4 and m8); see the chapter&#039;s authoring note.\n&quot;">
