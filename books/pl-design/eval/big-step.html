Notice the rule is **compositional**: the meaning of `e1 + e2` is defined in terms of the
meanings of its subexpressions. That structure is exactly what makes a recursive tree-walking
evaluator the natural implementation.

## From rules to Rust

Each rule becomes one arm of a `match` over the AST. The premises become recursive calls; the
conclusion becomes the returned value.

```rust
enum Expr {
    Lit(i64),
    Add(Box<Expr>, Box<Expr>),
}

fn eval(e: &Expr) -> i64 {
    match e {
        Expr::Lit(n) => *n,                       // E-Lit
        Expr::Add(a, b) => eval(a) + eval(b),     // E-Add
    }
}

fn main() {
    // (1 + 2) + 4
    let e = Expr::Add(
        Box::new(Expr::Add(Box::new(Expr::Lit(1)), Box::new(Expr::Lit(2)))),
        Box::new(Expr::Lit(4)),
    );
    println!("{}", eval(&e)); // 7
}
```

The correspondence between rules and `match` arms is the throughline of the whole book: **to
add a feature, we write its rules, then we add the arms.**

> **Looking ahead.** Right now `eval` cannot fail. Once values include more than integers
> (booleans, functions, …), some expressions will have *no* rule that applies — e.g. adding a
> boolean to a function. Those are **runtime type errors**, and eliminating them ahead of time is
> the job of the [type checker](../types/type-checker.md) we build in Part VI.
-->
